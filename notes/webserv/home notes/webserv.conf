http {

    # ============================
    # Global settings
    # ============================

    # Maximum allowed request body size
    client_max_body_size 20M;

    # Default error pages
    error_page 400 /errors/400.html;
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 500 /errors/50x.html;


    # ============================
    # First website
    # ============================
    server {
        listen 127.0.0.1:8080;
        server_name site1.local;

        root /var/www/site1;

        location / {
            # Only allow GET and HEAD
            limit_except GET HEAD {
                deny all;
            }

            # Default index file
            index index.html;
        }

        # Example: /kapouet → /tmp/www/...
        location /kapouet/ {
            root /tmp/www;
            autoindex off;        # disable directory listing
            index index.html;     # serve if directory
        }

        # Directory listing enabled
        location /list/ {
            root /var/www/site1;
            autoindex on;
        }

        # Simple HTTP redirection
        location /oldpage {
            return 301 /newpage;
        }

        # File upload area
        location /upload {
            client_max_body_size 50M;
            root /var/www/uploads;
            upload_store /var/www/uploads;
        }

        # CGI execution based on extension (.php here as example)
        location ~ \.php$ {
            root /var/www/site1;
            cgi_pass /usr/bin/php-cgi;
        }
    }


    # ============================
    # Second website
    # ============================
    server {
        listen 0.0.0.0:9090;
        server_name site2.local;

        root /var/www/site2;

        location / {
            index index.html;
        }

        # CGI execution for .py scripts
        location ~ \.py$ {
            root /var/www/site2/cgi-bin;
            cgi_pass /usr/bin/python3;
        }
    }
}
