pid /tmp/nginx.pid;

events {}

http
{
	error_log /tmp/error.log;
    access_log /tmp/access.log;

    server
	{
        listen 8080;
        server_name www.example.org;
        root /home/youruser/current_folder/html;
        index index.html;

        location / {
            autoindex on;
        }
    }
}
